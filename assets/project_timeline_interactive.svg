<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .grid-line { stroke: #21262d; stroke-width: 1; stroke-dasharray: 4 4; }
      .axis-text { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .title-text { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; }
      
      .bar { transition: transform 0.15s ease, filter 0.15s ease; cursor: pointer; }
      .bar-group:hover .bar { filter: brightness(1.25); }
      
      .tooltip {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease-in-out;
      }
      .bar-group:hover .tooltip {
        opacity: 1;
      }
      
      .tt-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5)); }
      .tt-title { fill: #c9d1d9; font-weight: 600; font-size: 11px; }
      .tt-text { fill: #8b949e; font-size: 11px; }
      .tt-val { fill: #f0f6fc; font-weight: 600; font-size: 11px; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="360" />

  <!-- Title -->
  <text x="30" y="35" class="title-text">Project Timeline (Interactive Hover)</text>

  <!-- Y-Axis Grid Lines & Labels -->
